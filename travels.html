<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="logo.png">
<title>Travel Photography - Kartik Hans</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.6;
  color: #333;
  background: #fff;
  margin: 0;
  padding: 20px;
}

.content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 0;
}

/* Navigation */
nav {
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 1px solid #eee;
}

nav a {
  color: #1a73e8;
  text-decoration: none;
  margin-right: 20px;
  font-size: 0.95em;
}

nav a:hover {
  text-decoration: underline;
}

nav a.active {
  color: #333;
  font-weight: 600;
}

/* Page Header */
h1 {
  color: #2e7d32;
  margin: 0 0 8px 0;
  font-size: 2em;
  font-weight: 600;
}

.page-description {
  color: #666;
  margin-bottom: 40px;
}

/* Location Section */
.location-section {
  margin-bottom: 50px;
}

.location-section h2 {
  color: #1a237e;
  font-size: 1.3em;
  font-weight: 600;
  margin: 0 0 8px 0;
}

.location-date {
  color: #888;
  font-size: 0.9em;
  margin-bottom: 20px;
}

/* Photo Gallery Grid */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  aspect-ratio: 4/3;
  background: #f5f5f5;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.gallery-item:hover img {
  transform: scale(1.05);
}

.gallery-item .caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  color: #fff;
  font-size: 0.9em;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.gallery-item:hover .caption {
  opacity: 1;
}

/* Lightbox (click to expand) */
.lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 30px;
  color: #fff;
  font-size: 2em;
  cursor: pointer;
}

/* Empty State */
.coming-soon {
  text-align: center;
  padding: 60px 20px;
  color: #888;
}

.coming-soon h2 {
  color: #666;
  font-weight: 500;
}

/* Responsive */
@media (max-width: 680px) {
  h1 {
    font-size: 1.6em;
  }

  .gallery {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
}
</style>
</head>

<body>
<div class="content">

<nav>
  <a href="index.html">Home</a>
  <a href="blogs.html">Blog</a>
  <a href="travels.html" class="active">Travel Photography</a>
</nav>

<h1>Travel Photography</h1>
<p class="page-description">Capturing moments from my adventures around the world.</p>

<!-- Coming Soon Message (remove this section when you add photos) -->
<div class="coming-soon">
  <h2>Coming Soon</h2>
  <p>Travel photos will be added here soon. Stay tuned!</p>
</div>


</div>

<!-- Lightbox for expanded view -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
function openLightbox(element) {
  const img = element.querySelector('img');
  document.getElementById('lightbox-img').src = img.src;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

// Close on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});
</script>

</body>
</html>
